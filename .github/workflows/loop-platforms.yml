name: Loop platforms

on:
  workflow_dispatch:
  push:
    paths:
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "vcpkg.json"
      - "include/phoenix/loop/**"
      - "src/loop/**"
      - "include/phoenix/graph.hpp"
      - "src/cache.cpp"
      - "tests/loop_*"
      - ".github/workflows/loop-platforms.yml"
  pull_request:

jobs:
  gcc:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        preset: [linux-debug, linux-release]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-build-prerequisites
      - uses: lukka/run-vcpkg@v11
      - uses: lukka/run-cmake@v10
        with:
          configurePreset: ${{ matrix.preset }}
          buildPreset: build-${{ matrix.preset }}
      - run: build/${{ matrix.preset }}/phoenix_loop_runtime_tests
      - run: build/${{ matrix.preset }}/phoenix_loop_function_body_tests
      - run: build/${{ matrix.preset }}/phoenix_loop_geometry_transaction_tests
      - run: build/${{ matrix.preset }}/phoenix_loop_instruction_tests

  apple-silicon:
    runs-on: macos-14
    strategy:
      matrix:
        preset: [macos-apple-silicon-debug, macos-apple-silicon-release]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-build-prerequisites
      - uses: lukka/run-vcpkg@v11
      - uses: lukka/run-cmake@v10
        with:
          configurePreset: ${{ matrix.preset }}
          buildPreset: build-${{ matrix.preset }}
      - run: build/${{ matrix.preset }}/phoenix_loop_runtime_tests
      - run: build/${{ matrix.preset }}/phoenix_loop_function_body_tests
      - run: build/${{ matrix.preset }}/phoenix_loop_geometry_transaction_tests
      - run: build/${{ matrix.preset }}/phoenix_loop_instruction_tests
