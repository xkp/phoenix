name: Merge platforms

on:
  workflow_dispatch:
  push:
    paths:
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "vcpkg.json"
      - "include/phoenix/merge/**"
      - "include/phoenix/inset/ported/cleanup_face.h"
      - "include/phoenix/partition/**"
      - "src/merge/**"
      - "tests/merge_*"
      - ".github/workflows/merge-platforms.yml"
  pull_request:

jobs:
  gcc:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        preset: [linux-debug, linux-release]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-build-prerequisites
      - uses: lukka/run-vcpkg@v11
      - uses: lukka/run-cmake@v10
        with:
          configurePreset: ${{ matrix.preset }}
      - run: cmake --build build/${{ matrix.preset }} --parallel 1 --target phoenix_merge_production_oracle_tests phoenix_merge_production_adapter_tests
      - run: build/${{ matrix.preset }}/phoenix_merge_production_oracle_tests
      - run: build/${{ matrix.preset }}/phoenix_merge_production_adapter_tests

  apple-silicon:
    runs-on: macos-14
    strategy:
      matrix:
        preset: [macos-apple-silicon-debug, macos-apple-silicon-release]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-build-prerequisites
      - uses: lukka/run-vcpkg@v11
      - uses: lukka/run-cmake@v10
        with:
          configurePreset: ${{ matrix.preset }}
      - run: cmake --build build/${{ matrix.preset }} --parallel 1 --target phoenix_merge_production_oracle_tests phoenix_merge_production_adapter_tests
      - run: build/${{ matrix.preset }}/phoenix_merge_production_oracle_tests
      - run: build/${{ matrix.preset }}/phoenix_merge_production_adapter_tests
